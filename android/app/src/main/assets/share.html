<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d6efd">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Med List">
    <title>File Received - Med List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            padding-top: 12px;
            overflow-x: hidden;
        }

        .chooser-card {
            max-width: 480px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 28px 22px;
        }

        .chooser-card h1 {
            color: #16a34a;
            font-size: 1.3em;
            text-align: center;
            margin-bottom: 18px;
        }

        .file-info {
            background: #f0f4ff;
            border: 1px solid #d5ddff;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
            margin-bottom: 22px;
            word-break: break-word;
        }

        .file-info .fname {
            font-weight: 700;
            color: #1a1a2e;
            font-size: 1.05em;
            line-height: 1.4;
        }

        .file-info .fmeta {
            color: #667;
            font-size: 0.88em;
            margin-top: 4px;
        }

        .chooser-card h2 {
            color: #1a1a2e;
            font-size: 1em;
            text-align: center;
            margin-bottom: 14px;
        }

        .dest-btn {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            padding: 16px 18px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            min-height: 52px;
            transition: transform 0.1s ease, opacity 0.2s;
            font-family: inherit;
        }

        .dest-btn:active { transform: scale(0.98); }

        .dest-upload    { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        .dest-search    { background: #eef2ff; color: #3730a3; }
        .dest-dedup     { background: #f0fdf4; color: #166534; }
        .dest-diff      { background: #fff7ed; color: #9a3412; }
        .dest-genhtml   { background: #fdf2f8; color: #9d174d; }

        .dest-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .dest-note {
            display: block;
            font-size: 0.75em;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 3px;
        }

        .cancel-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: transparent;
            color: #666;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .status-msg {
            display: none;
            text-align: center;
            color: #555;
            font-size: 0.9em;
            padding: 12px;
            border-radius: 10px;
            background: #f8f9fa;
            margin-top: 8px;
        }

        @media (max-width: 480px) {
            body { padding: 12px; padding-top: 12px; }
            .chooser-card { padding: 22px 16px; margin: 8px auto; }
        }
    </style>
</head>
<body>
    

    <div class="chooser-card">
        <h1>✓ File ready on your phone</h1>

        <div class="file-info">
            <div class="fname" id="fname"></div>
            <div class="fmeta" id="fmeta"></div>
        </div>

        <h2>Where do you want to use this file?</h2>

        <button class="dest-btn dest-upload" id="destUpload">
            🚀 Upload / Process
            <span class="dest-note">Keep in your 6-file batch</span>
        </button>
        <button class="dest-btn dest-search" id="destSearch">
            🔍 Search Medicines
            <span class="dest-note">Search across this file</span>
        </button>
        <button class="dest-btn dest-dedup" id="destDedup">
            🧹 Deduplicate
            <span class="dest-note">Remove duplicate entries</span>
        </button>
        <button class="dest-btn dest-diff" id="destDiff">
            🔄 Compare / Diff
            <span class="dest-note">Use as File A, pick File B manually</span>
        </button>
        <button class="dest-btn dest-genhtml" id="destGenHtml">
            📄 Generate HTML
            <span class="dest-note">Turn the list into a styled HTML file</span>
        </button>

        <button class="cancel-btn" id="destCancel">✕ Cancel</button>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <!-- Same-request file payload. Rendered with |tojson so <, >, & are escaped;
         bytes are base64, never raw HTML. Consumed once, then nulled. -->
    <script id="shared-payload" type="application/json">__MEDLIST_PAYLOAD__</script>

    <script>
/* shared-store.js — IndexedDB persistence for the medicine-list app.
 *
 * One object store 'files' holds records:
 *   { id, filename, type, ext, size, blob, source ('shared'|'manual'), created }
 *
 * The Index 3-file batch = records with batch_slot 0..2 in store meta 'index_batch'.
 * Shared documents NEVER go to Cache Storage — IndexedDB only.
 */
(function (global) {
    'use strict';

    const DB_NAME = 'medlist-shared';
    const DB_VERSION = 1;
    const FILES_STORE = 'files';
    const META_STORE = 'meta';
    const INDEX_BATCH_KEY = 'index_batch';   // array of record ids, max INDEX_BATCH_LIMIT
    const INDEX_BATCH_LIMIT = 6;             // Index/Home persistent batch capacity
    const INDEX_BATCH_TTL_MS = 2 * 60 * 60 * 1000;  // Index files expire 2h after ADD time
    const TTL_MS = 24 * 60 * 60 * 1000;      // 24h cleanup for orphans (non-batch records)

    let _dbPromise = null;

    function openDB() {
        if (_dbPromise) return _dbPromise;
        _dbPromise = new Promise(function (resolve, reject) {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = function (e) {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(FILES_STORE)) {
                    db.createObjectStore(FILES_STORE, { keyPath: 'id' });
                }
                if (!db.objectStoreNames.contains(META_STORE)) {
                    db.createObjectStore(META_STORE);
                }
            };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error); };
        });
        return _dbPromise;
    }

    function tx(storeName, mode, fn) {
        return openDB().then(function (db) {
            return new Promise(function (resolve, reject) {
                const t = db.transaction(storeName, mode);
                const store = t.objectStore(storeName);
                let result;
                try { result = fn(store); } catch (err) { reject(err); return; }
                t.oncomplete = function () { resolve(result && result.__req ? result.__req.result : result); };
                t.onerror = function () { reject(t.error); };
                t.onabort = function () { reject(t.error); };
            });
        });
    }

    function reqToPromise(request) {
        return new Promise(function (resolve, reject) {
            request.onsuccess = function () { resolve(request.result); };
            request.onerror = function () { reject(request.error); };
        });
    }

    // ---------- generic records ----------

    function newId() {
        return (crypto.randomUUID && crypto.randomUUID()) ||
               ('f-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10));
    }

    /** Save a new file record; returns the record (with id). */
    function putFile(filename, type, ext, blob, source, lastModified) {
        const record = {
            id: newId(),
            filename: filename,
            type: type,
            ext: ext,
            size: blob.size,
            blob: blob,
            source: source || 'shared',
            lastModified: lastModified || 0,
            created: Date.now()
        };
        return tx(FILES_STORE, 'readwrite', function (store) {
            store.put(record);
        }).then(function () { return record; });
    }

    function getFile(id) {
        return openDB().then(function (db) {
            return reqToPromise(db.transaction(FILES_STORE).objectStore(FILES_STORE).get(id));
        });
    }

    function deleteFile(id) {
        return tx(FILES_STORE, 'readwrite', function (store) {
            store.delete(id);
        });
    }

    /** Remove old orphan records not referenced by any batch/state (TTL),
     *  plus Index batch records past their 2h TTL. */
    function cleanupOrphans() {
        return Promise.all([
            getIndexBatchIds(),
            getDiffState()
        ]).then(function (refs) {
            const keep = {};
            const batchIds = refs[0] || [];
            batchIds.forEach(function (id) { keep[id] = true; });
            if (refs[1] && refs[1].oldFileId) keep[refs[1].oldFileId] = true;
            if (refs[1] && refs[1].newFileId) keep[refs[1].newFileId] = true;
            return openDB().then(function (db) {
                return new Promise(function (resolve) {
                    const t = db.transaction(FILES_STORE, 'readwrite');
                    const store = t.objectStore(FILES_STORE);
                    const r = store.getAll();
                    r.onsuccess = function () {
                        const now = Date.now();
                        r.result.forEach(function (rec) {
                            const inIndexBatch = batchIds.indexOf(rec.id) !== -1;
                            // Index batch records: 2h TTL from creation.
                            if (inIndexBatch && now - rec.created > INDEX_BATCH_TTL_MS) {
                                store.delete(rec.id);
                                return;
                            }
                            // Orphans (not referenced anywhere): 24h TTL.
                            if (!keep[rec.id] && now - rec.created > TTL_MS) {
                                store.delete(rec.id);
                            }
                        });
                    };
                    t.oncomplete = function () { resolve(true); };
                    t.onerror = function () { resolve(true); };
                });
            });
        }).then(function () {
            // Drop expired ids from the meta array so the count stays honest.
            return purgeExpiredIndexBatch();
        }).then(function () { return true; });
    }

    // ---------- index 3-file batch ----------

    function getMeta(key) {
        return openDB().then(function (db) {
            return reqToPromise(db.transaction(META_STORE).objectStore(META_STORE).get(key));
        });
    }

    function setMeta(key, value) {
        return tx(META_STORE, 'readwrite', function (store) {
            store.put(value, key);
        });
    }

    function getIndexBatchIds() {
        return getMeta(INDEX_BATCH_KEY).then(function (v) {
            return Array.isArray(v) ? v : [];
        });
    }

    /** Remove Index batch entries whose records are older than
     *  INDEX_BATCH_TTL_MS. Expiration is PER-FILE, based on each record's
     *  original `created` timestamp — never reset by Process/display/refresh.
     *  Run before rendering the batch and before enforcing the 6-file cap. */
    function purgeExpiredIndexBatch() {
        return getIndexBatchIds().then(function (ids) {
            if (!ids.length) return [];
            const now = Date.now();
            return Promise.all(ids.map(getFile)).then(function (recs) {
                const keepIds = [];
                const expiredIds = [];
                recs.forEach(function (rec, i) {
                    if (rec && (now - rec.created) <= INDEX_BATCH_TTL_MS) {
                        keepIds.push(rec.id);
                    } else {
                        // missing record or expired — drop the id either way
                        expiredIds.push(ids[i]);
                    }
                });
                if (expiredIds.length) {
                    return Promise.all(expiredIds.map(deleteFile)).then(function () {
                        return setMeta(INDEX_BATCH_KEY, keepIds).then(function () {
                            return keepIds;
                        });
                    });
                }
                return ids;
            });
        });
    }

    /** Append a file id to the Index batch. Rejects if batch already has 3. */
    function appendToIndexBatch(id) {
        // Purge expired entries FIRST so stale ids never occupy the limit.
        return purgeExpiredIndexBatch().then(function (ids) {
            if (ids.length >= INDEX_BATCH_LIMIT) {
                return { ok: false, reason: 'full', ids: ids };
            }
            if (ids.indexOf(id) === -1) ids.push(id);
            return setMeta(INDEX_BATCH_KEY, ids).then(function () {
                return { ok: true, ids: ids };
            });
        });
    }

    /** Full Index batch records (in slot order), expired entries purged. */
    function getIndexBatch() {
        return purgeExpiredIndexBatch().then(function (ids) {
            return Promise.all(ids.map(getFile)).then(function (recs) {
                return recs.filter(Boolean);
            });
        });
    }

    /** Remove one id from the batch (record itself is deleted too). */
    function removeFromIndexBatch(id) {
        return getIndexBatchIds().then(function (ids) {
            const remaining = ids.filter(function (x) { return x !== id; });
            return setMeta(INDEX_BATCH_KEY, remaining).then(function () {
                return deleteFile(id).then(function () { return remaining; });
            });
        });
    }

    /** Clear the whole Index batch and delete its records. Central helper. */
    function clearIndexBatch() {
        return getIndexBatchIds().then(function (ids) {
            return Promise.all(ids.map(deleteFile)).then(function () {
                return setMeta(INDEX_BATCH_KEY, []);
            });
        });
    }

    // ---------- diff two-slot state ----------
    // { oldFileId: <record id|null>, newFileId: <record id|null> }
    const DIFF_STATE_KEY = 'diff_state';

    function getDiffState() {
        return getMeta(DIFF_STATE_KEY).then(function (v) {
            return (v && typeof v === 'object') ? v : { oldFileId: null, newFileId: null };
        });
    }

    function setDiffState(state) {
        return setMeta(DIFF_STATE_KEY, {
            oldFileId: state.oldFileId || null,
            newFileId: state.newFileId || null
        });
    }

    function clearDiffState() {
        return setDiffState({ oldFileId: null, newFileId: null });
    }

    // ---------- destination-scoped clearing ----------
    // Choosing a destination clears ONLY the other destinations' working
    // state — never the chosen destination's own state.
    function clearOtherDestinationStates(chosen) {
        const jobs = [];
        if (chosen !== 'index') jobs.push(clearIndexBatch());
        if (chosen !== 'diff') jobs.push(clearDiffState());
        return Promise.all(jobs);
    }

    // ---------- conversion helpers ----------

    /** Build a browser File object from a record's blob. */
    function recordToFile(record) {
        const mimeByExt = {
            '.pdf': 'application/pdf',
            '.txt': 'text/plain',
            '.html': 'text/html',
            '.htm': 'text/html'
        };
        const type = mimeByExt[record.ext] || record.type || 'application/octet-stream';
        return new File([record.blob], record.filename, { type: type });
    }

    function base64ToBlob(b64, mime) {
        const bin = atob(b64);
        const len = bin.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
        return new Blob([bytes], { type: mime || 'application/octet-stream' });
    }

    function fmtSize(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }

    global.SharedStore = {
        putFile: putFile,
        getFile: getFile,
        deleteFile: deleteFile,
        cleanupOrphans: cleanupOrphans,
        appendToIndexBatch: appendToIndexBatch,
        getIndexBatch: getIndexBatch,
        getIndexBatchIds: getIndexBatchIds,
        purgeExpiredIndexBatch: purgeExpiredIndexBatch,
        removeFromIndexBatch: removeFromIndexBatch,
        clearIndexBatch: clearIndexBatch,
        getDiffState: getDiffState,
        setDiffState: setDiffState,
        clearDiffState: clearDiffState,
        clearOtherDestinationStates: clearOtherDestinationStates,
        recordToFile: recordToFile,
        base64ToBlob: base64ToBlob,
        fmtSize: fmtSize,
        MAX_BATCH: INDEX_BATCH_LIMIT,
        INDEX_BATCH_TTL_MS: INDEX_BATCH_TTL_MS
    };
})(window);

</script>
    <script>
        (function () {
            // Client timing diagnostics (sizes/stages only, never file contents).
            var T0 = performance.now();
            function tlog(label) {
                console.debug('[share-timing] ' + label + ': ' +
                              (performance.now() - T0).toFixed(1) + 'ms');
            }
            tlog('bridge script start');

            const payloadEl = document.getElementById('shared-payload');
            let payload = null;
            try { payload = JSON.parse(payloadEl.textContent); } catch (e) { payload = null; }
            tlog('payload decode complete');

            const status = document.getElementById('statusMsg');
            const ext = (payload && payload.ext) || '';
            const isPdf = ext === '.pdf';
            const isHtml = ext === '.html' || ext === '.htm';
            const isTxt = ext === '.txt';

            // Show human-readable size; disable destinations that cannot
            // consume this file type (no fake buttons).
            if (payload) {
                document.getElementById('fname').textContent = payload.filename;
                document.getElementById('fmeta').textContent =
                    payload.type + ' • ' + SharedStore.fmtSize(payload.size);
            }
            requestAnimationFrame(function () { tlog('chooser DOM visible'); });
            if (isPdf) {
                // Diff parses HTML in-browser; Make HTML reads TXT/HTML; Dedup is TXT.
                document.getElementById('destDiff').disabled = true;
                document.getElementById('destGenHtml').disabled = true;
                document.getElementById('destDedup').disabled = true;
            } else if (isHtml) {
                document.getElementById('destDedup').disabled = true;
            }

            function showStatus(msg) {
                status.style.display = 'block';
                status.textContent = msg;
            }

            function unlockAll() {
                document.querySelectorAll('.dest-btn, .cancel-btn').forEach(b => { b.disabled = false; });
                if (isPdf) { document.getElementById('destDiff').disabled = true; document.getElementById('destGenHtml').disabled = true; }
                if (isPdf || isHtml) document.getElementById('destDedup').disabled = true;
            }

            function lockAll() {
                document.querySelectorAll('.dest-btn, .cancel-btn').forEach(function (b) {
                    b.disabled = true;
                });
            }

            if (!payload || !payload.data_b64) {
                showStatus('Could not read the received file. Please share it again.');
                return;
            }

            let recordId = null;

            function commitToIndexedDB() {
                if (recordId) return Promise.resolve(recordId);
                tlog('IndexedDB save start');
                const blob = SharedStore.base64ToBlob(payload.data_b64, 'application/octet-stream');
                tlog('Blob/File creation complete');
                return SharedStore.putFile(payload.filename, payload.type, ext, blob, 'shared')
                    .then(function (record) {
                        recordId = record.id;
                        tlog('IndexedDB save complete');
                        // File is now safely on-device. Free the in-page payload.
                        payloadEl.textContent = '{}';
                        return record.id;
                    });
            }

            function destination(kind) {
                lockAll();
                showStatus('Preparing…');
                commitToIndexedDB().then(function (id) {
                    if (kind === 'index') {
                        // Index: clear OTHER destinations' state (diff), keep Index batch.
                        return SharedStore.clearOtherDestinationStates('index').then(function () {
                            return SharedStore.appendToIndexBatch(id).then(function (res) {
                                if (!res.ok) {
                                    // Batch full — discard ONLY the new file, keep A+B+C.
                                    return Promise.resolve().then(function () {
                                        unlockAll();
                                        showStatus('You already have 6 files in this batch. ' +
                                                   'Remove one before adding another.');
                                    });
                                }
                                window.location.href = '/';
                            });
                        });
                    }
                    if (kind === 'diff') {
                        // Diff has two slots: Old (filled first) and New (filled second).
                        // Third file: show Replace Old / Replace New / Cancel.
                        return SharedStore.clearOtherDestinationStates('diff').then(function () {
                            return SharedStore.getDiffState().then(function (state) {
                                if (!state.oldFileId) {
                                    // Old empty → fill Old.
                                    return SharedStore.setDiffState({ oldFileId: id, newFileId: null })
                                        .then(function () { window.location.href = '/diff'; });
                                }
                                if (!state.newFileId) {
                                    // Old exists, New empty → fill New.
                                    return SharedStore.setDiffState({ oldFileId: state.oldFileId, newFileId: id })
                                        .then(function () { window.location.href = '/diff'; });
                                }
                                // Both slots full → show Replace Old / Replace New / Cancel.
                                showReplaceChooser(id, state);
                            });
                        });
                    }
                    // Other destinations: clear other states, then route.
                    return SharedStore.clearOtherDestinationStates(kind).then(function () {
                        var map = {
                            search: '/search?sharedid=' + encodeURIComponent(id),
                            dedup: '/deduplicate?sharedid=' + encodeURIComponent(id),
                            genhtml: '/make_html?sharedid=' + encodeURIComponent(id)
                        };
                        tlog('redirect/navigation start');
                        window.location.href = map[kind];
                    });
                }).catch(function (err) {
                    unlockAll();
                    console.warn('share destination failed:', err);
                    showStatus('Something went wrong storing the file. Please try again.');
                });
            }

            function showReplaceChooser(incomingId, state) {
                // Fetch filenames for Old/New to display.
                Promise.all([SharedStore.getFile(state.oldFileId), SharedStore.getFile(state.newFileId)])
                    .then(function (recs) {
                        var oldName = recs[0] ? recs[0].filename : 'Old file';
                        var newName = recs[1] ? recs[1].filename : 'New file';
                        status.innerHTML =
                            '<div style="text-align:left; margin-bottom:12px;">' +
                            '<strong>Both Diff files are already selected.</strong><br>' +
                            '<div style="margin-top:8px; padding:8px; background:#f0f4ff; border-radius:8px;">' +
                            '<strong>OLD:</strong> ' + escapeHtml(oldName) + '</div>' +
                            '<div style="margin-top:4px; padding:8px; background:#fff7ed; border-radius:8px;">' +
                            '<strong>NEW:</strong> ' + escapeHtml(newName) + '</div>' +
                            '</div>' +
                            '<div style="font-size:0.95em; margin-bottom:8px;">Where should the new file go?</div>';
                        status.style.display = 'block';

                        // Create buttons: Replace Old, Replace New, Cancel.
                        var btnOld = document.createElement('button');
                        btnOld.className = 'dest-btn dest-diff';
                        btnOld.textContent = 'Replace Old';
                        btnOld.style.marginBottom = '8px';
                        btnOld.onclick = function () {
                            SharedStore.deleteFile(state.oldFileId).then(function () {
                                return SharedStore.setDiffState({ oldFileId: incomingId, newFileId: state.newFileId });
                            }).then(function () { window.location.href = '/diff'; });
                        };

                        var btnNew = document.createElement('button');
                        btnNew.className = 'dest-btn dest-diff';
                        btnNew.textContent = 'Replace New';
                        btnNew.style.marginBottom = '8px';
                        btnNew.onclick = function () {
                            SharedStore.deleteFile(state.newFileId).then(function () {
                                return SharedStore.setDiffState({ oldFileId: state.oldFileId, newFileId: incomingId });
                            }).then(function () { window.location.href = '/diff'; });
                        };

                        var btnCancel = document.createElement('button');
                        btnCancel.className = 'cancel-btn';
                        btnCancel.textContent = 'Cancel';
                        btnCancel.onclick = function () {
                            SharedStore.deleteFile(incomingId).then(function () { window.location.href = '/diff'; });
                        };

                        status.appendChild(document.createElement('br'));
                        status.appendChild(btnOld);
                        status.appendChild(btnNew);
                        status.appendChild(btnCancel);
                    });
            }

            function escapeHtml(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            document.getElementById('destUpload').addEventListener('click', function () { destination('index'); });
            document.getElementById('destSearch').addEventListener('click', function () { destination('search'); });
            document.getElementById('destDedup').addEventListener('click', function () { destination('dedup'); });
            document.getElementById('destDiff').addEventListener('click', function () { destination('diff'); });
            document.getElementById('destGenHtml').addEventListener('click', function () { destination('genhtml'); });

            document.getElementById('destCancel').addEventListener('click', function () {
                lockAll();
                showStatus('Discarded. Nothing was changed.');
                if (recordId) {
                    SharedStore.deleteFile(recordId);
                } else {
                    // Not yet committed — simply drop the in-page payload.
                    payload = null;
                    payloadEl.textContent = '{}';
                }
                setTimeout(function () { window.location.href = '/'; }, 800);
            });
        })();
    </script>
