name: Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build installable test APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MedList-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
      - name: Publish downloadable Android test build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/build/medlist-native-apk'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MedList-Native.apk
          if ! gh release view native-latest >/dev/null 2>&1; then
            gh release create native-latest --target "$GITHUB_SHA" --title "MedList Native Android (test build)" --notes "Android 8 or newer. Test build for native file sharing." --prerelease
          fi
          gh release upload native-latest MedList-Native.apk --clobber
