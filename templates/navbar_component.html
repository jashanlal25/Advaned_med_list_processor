    /* ========== EXTRAORDINARY NAVIGATION HEADER ========== */
    .nav-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 70px;
        background: linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.95) 50%, rgba(15, 52, 96, 0.95) 100%);

    .nav-header::before {
        content: '';

    .nav-logo {

    /* Ensure header buttons are never affected by other styles */

    /* Responsive Design */

<script>
    // Cycle through Light → Dark → Dim. Dim is intentionally a soft off-white
    // option for users who want less glare without the full dark palette.
    function toggleTheme() {
        const body = document.body;
        const themeToggle = document.getElementById('themeToggle');
        const currentTheme = body.getAttribute('data-theme') || 'light';

        if (currentTheme === 'light') {
            body.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀️';
            localStorage.setItem('theme', 'dark');
        } else if (currentTheme === 'dark') {
            body.setAttribute('data-theme', 'dim');
            themeToggle.textContent = '🌗';
            localStorage.setItem('theme', 'dim');
        } else {
            body.removeAttribute('data-theme');
            themeToggle.textContent = '🌙';
            localStorage.setItem('theme', 'light');
        }
    }

    // Apply saved theme (with system preference fallback) and sync the toggle icon.
    // Exposed as a named function so pages may call initTheme() after DOM ready.
    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const themeToggle = document.getElementById('themeToggle');
        if (savedTheme === 'dim') {
            document.body.setAttribute('data-theme', 'dim');
            if (themeToggle) themeToggle.textContent = '🌗';
        } else if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.body.setAttribute('data-theme', 'dark');
            if (themeToggle) themeToggle.textContent = '☀️';
        } else {
            if (themeToggle) themeToggle.textContent = '🌙';
        }
    }

    // Apply theme on load (idempotent; harmless even if a page also calls initTheme later)
    initTheme();

    // Mobile menu toggle
    function toggleMobileMenu() {
        const mobileNav = document.getElementById('mobileNav');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        mobileNav.classList.toggle('show');
        mobileMenuBtn.classList.toggle('active');
    }

    // Close mobile menu when clicking outside
    document.addEventListener('click', function(e) {
        const mobileNav = document.getElementById('mobileNav');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        if (mobileNav && mobileMenuBtn && !mobileNav.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
            mobileNav.classList.remove('show');
            mobileMenuBtn.classList.remove('active');
        }
    });

    // Set active navigation link based on current page
    (function() {
        const currentPage = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link');

        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPage || (currentPage === '/' && href === '/')) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
    })();

    // PWA Install prompt
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    function installPWA() {
        if (deferredPrompt) {
            // Auto install available
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                deferredPrompt = null;
            });
        } else {
            // Show manual instructions
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isAndroid = /Android/.test(navigator.userAgent);

            let msg = '';
            if (isIOS) {
                msg = 'To install on iPhone/iPad:\n\n1. Tap the Share button (box with arrow)\n2. Scroll down and tap "Add to Home Screen"\n3. Tap "Add"';
            } else if (isAndroid) {
                msg = 'To install on Android:\n\n1. Tap the menu (3 dots) in browser\n2. Tap "Add to Home Screen" or "Install App"\n3. Tap "Add"';
            } else {
                msg = 'To install:\n\n1. Open browser menu\n2. Look for "Install App" or "Add to Home Screen"';
            }
            alert(msg);
        }
    }

    const standaloneDisplay = window.matchMedia('(display-mode: standalone)');
    function isNativeMedList() {
        return window.__MEDLIST_NATIVE__ === true || /MedListNative\//.test(navigator.userAgent) ||
            (/Android/.test(navigator.userAgent) && navigator.standalone === true && !standaloneDisplay.matches);
    }
    function isInstalledMedListWindow() {
        return isNativeMedList() || standaloneDisplay.matches || navigator.standalone === true ||
            window.matchMedia('(display-mode: fullscreen)').matches;
    }
    function updateInstallVisibility() {
        if (installBtn) installBtn.hidden = isInstalledMedListWindow();
        const notice = document.getElementById('nativeUpgradeNotice');
        if (notice && isInstalledMedListWindow()) notice.hidden = true;
    }
    updateInstallVisibility();
    standaloneDisplay.addEventListener('change', updateInstallVisibility);
    window.addEventListener('appinstalled', () => {
        if (installBtn) installBtn.hidden = true;
        const notice = document.getElementById('nativeUpgradeNotice');
        if (notice) notice.hidden = true;
    });

    function showInstallHelp() {
        let dialog = document.getElementById('installChoices');
        if (!dialog) {
            dialog = document.createElement('dialog');
            dialog.id = 'installChoices';
            dialog.setAttribute('aria-labelledby', 'installChoicesTitle');
            dialog.innerHTML = `<div class="install-brand"><img src="/static/icon-192.png" alt=""><h2 id="installChoicesTitle">Install MedList</h2></div>
                <button type="button" class="install-choice" id="choosePWA">Install PWA</button>
                <p>Install the browser-based app.</p>
                <a class="install-choice" href="https://github.com/jashanlal25/Advaned_med_list_processor/releases/download/native-latest/MedList-Native.apk">Download Android APK</a>
                <p>Android 8 or newer · Test version with native file sharing.</p>
                <details><summary>How to install the APK</summary><ol>
                    <li>Download the APK, then open it from Downloads.</li>
                    <li>If Android asks, allow installation from this browser or file manager, then return to the installer.</li>
                    <li>If Play Protect offers a scan, tap <strong>Scan app</strong> and wait for the result.</li>
                    <li>If the scan reports no threats and installation is offered, tap <strong>Install</strong>, then <strong>Open</strong>. Button names can vary by phone.</li>
                </ol><p>Keep Play Protect enabled. If it reports a harmful app or blocks installation, stop and share the warning with us.</p></details>
                <details><summary>Switching from the old PWA?</summary><p>Install and test MedList Native first. Save or export anything you need from the old PWA, then long-press its icon and choose Uninstall or Remove. Its saved files do not automatically transfer to the APK.</p></details>
                <button type="button" class="install-close" id="closeInstallChoices">Close</button>`;
            document.body.appendChild(dialog);
            dialog.querySelector('#choosePWA').onclick = function () { dialog.close(); installPWA(); };
            dialog.querySelector('#closeInstallChoices').onclick = function () { dialog.close(); };
        }
        if (!dialog.open) dialog.showModal();
    }

    // Browsers cannot reliably detect this sideloaded APK. Offer a suggestion,
    // never treat an unknown installation state as proof that it is absent.
    if (/Android/.test(navigator.userAgent) && !isInstalledMedListWindow()) {
        let dismissed = false;
        try { dismissed = localStorage.getItem('nativeSharingNoticeDismissed') === 'yes'; } catch (_) {}
        if (!dismissed) {
            const notice = document.createElement('aside');
            notice.id = 'nativeUpgradeNotice';
            notice.setAttribute('aria-label', 'Android file sharing option');
            notice.innerHTML = '<strong>Trouble sharing files?</strong><p>Try the new MedList Native APK for Android file sharing. After testing it, you can remove the old PWA.</p><button type="button" id="nativeNoticeInstall">Get APK</button><button type="button" id="nativeNoticeDismiss">Already installed / Dismiss</button>';
            document.body.appendChild(notice);
            function dismissNativeNotice() {
                notice.hidden = true;
                try { localStorage.setItem('nativeSharingNoticeDismissed', 'yes'); } catch (_) {}
            }
            notice.querySelector('#nativeNoticeInstall').onclick = function () { dismissNativeNotice(); showInstallHelp(); };
            notice.querySelector('#nativeNoticeDismiss').onclick = dismissNativeNotice;
            setTimeout(dismissNativeNotice, 4000);
        }
    }

    // Register the service worker for PWA installability.
    // Runs on every page (this component is included in all templates).
    if ('serviceWorker' in navigator) {
        let shareWorkerRefreshStarted = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (shareWorkerRefreshStarted) {
                return;
            }
            shareWorkerRefreshStarted = true;
            window.location.reload();
        });

        window.addEventListener('load', () => {
            const swUrl = {{ url_for('static', filename='service-worker.js')|tojson }};
            navigator.serviceWorker.register(swUrl, { scope: '/', updateViaCache: 'none' }).then((registration) => {
                console.log('Service Worker registered:', registration.scope);
                if (registration.waiting) {
                    registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
                return registration.update();
            }).then((registration) => {
                if (registration && registration.waiting) {
                    registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
            }).catch((error) => {
                // Log a warning but do not disrupt the page.
                console.warn('Service Worker registration failed:', error);
            });
        });
    }
</script>
