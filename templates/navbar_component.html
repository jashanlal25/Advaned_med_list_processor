<!-- ========== NAVIGATION HEADER COMPONENT ========== -->
<!-- This component includes CSS, HTML, and JavaScript for the navigation header -->

<style>
    /* ========== EXTRAORDINARY NAVIGATION HEADER ========== */
    .nav-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 70px;
        background: linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.95) 50%, rgba(15, 52, 96, 0.95) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3), 0 0 40px rgba(102, 126, 234, 0.1);
        z-index: 999;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 0 30px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg,
            transparent 0%,
            #667eea 20%,
            #764ba2 40%,
            #f093fb 60%,
            #667eea 80%,
            transparent 100%);
        animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    .nav-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        flex-shrink: 0;
    }

    .logo-icon {
        width: 45px;
        height: 45px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .logo-icon:hover {
        transform: rotate(10deg) scale(1.1);
        box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
    }

    .logo-text {
        color: #ffffff;
        font-size: 1.4em;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.05);
        padding: 8px 12px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        flex-shrink: 0;
    }

    .nav-link {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 12px;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .nav-link::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: -1;
    }

    .nav-link:hover::before {
        opacity: 1;
    }

    .nav-link:hover {
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .nav-link.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .nav-link-icon {
        font-size: 16px;
    }

    .nav-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        justify-self: end;
    }

    .theme-toggle {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
        border: 1px solid rgba(102, 126, 234, 0.3);
        width: 40px;
        height: 40px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 18px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .theme-toggle:hover {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
        transform: rotate(15deg) scale(1.1);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .top-buttons {
        display: flex;
        gap: 8px;
    }

    .install-btn-placeholder {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 32px;
        visibility: hidden;
        flex-shrink: 0;
    }

    .install-btn {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .install-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }

    .install-btn-icon {
        font-size: 14px;
    }

    /* Mobile menu button */
    .mobile-menu-btn {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
        border: 1px solid rgba(102, 126, 234, 0.3);
        width: 40px;
        height: 40px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 0;
    }

    .mobile-menu-btn span {
        width: 18px;
        height: 2px;
        background: #ffffff;
        border-radius: 2px;
        transition: all 0.3s ease;
    }

    .mobile-menu-btn.active span:nth-child(1) {
        transform: rotate(45deg) translate(5px, 5px);
    }

    .mobile-menu-btn.active span:nth-child(2) {
        opacity: 0;
    }

    .mobile-menu-btn.active span:nth-child(3) {
        transform: rotate(-45deg) translate(5px, -5px);
    }

    .mobile-menu-btn:hover {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    /* Mobile Navigation */
    .mobile-nav {
        display: none;
        position: fixed;
        top: 70px;
        left: 0;
        right: 0;
        background: rgba(26, 26, 46, 0.98);
        backdrop-filter: blur(20px);
        padding: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        z-index: 998;
    }

    .mobile-nav.show {
        display: block;
        animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .mobile-nav .nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 20px;
        margin-bottom: 8px;
        border-radius: 12px;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.8);
        font-size: 16px;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .mobile-nav .nav-link:hover,
    .mobile-nav .nav-link.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    /* Ensure header buttons are never affected by other styles */
    .nav-header .btn,
    .nav-header .install-btn {
        width: auto !important;
        min-width: auto !important;
        max-width: none !important;
        padding: 10px 16px !important;
        font-size: 12px !important;
        margin: 0 !important;
        box-sizing: border-box !important;
        height: auto !important;
    }

    /* Specific button sizing for header controls */
    .nav-header .theme-toggle {
        width: 40px !important;
        height: 40px !important;
        padding: 0 !important;
        font-size: 18px !important;
        min-width: auto !important;
        max-width: none !important;
        margin: 0 !important;
        box-sizing: border-box !important;
    }

    .nav-header .mobile-menu-btn {
        width: 40px !important;
        height: 40px !important;
        padding: 0 !important;
        font-size: 18px !important;
        min-width: auto !important;
        max-width: none !important;
        margin: 0 !important;
        box-sizing: border-box !important;
        display: none !important;
    }

    /* Responsive Design */
    @media screen and (max-width: 768px) {
        .nav-header {
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
        }

        .nav-links {
            display: none;
        }

        .top-buttons {
            display: none;
        }

        .mobile-menu-btn {
            display: flex;
        }

        .nav-actions {
            gap: 8px;
        }

        .nav-header .theme-toggle {
            width: 36px !important;
            height: 36px !important;
        }

        .nav-header .mobile-menu-btn {
            display: flex !important;
        }

        .install-btn {
            padding: 8px 12px;
            font-size: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            font-size: 20px;
        }

        .logo-text {
            font-size: 1.2em;
        }
    }

    @media screen and (max-width: 480px) {
        .nav-header .theme-toggle {
            width: 32px !important;
            height: 32px !important;
            font-size: 16px !important;
        }

        .nav-header .mobile-menu-btn {
            width: 32px !important;
            height: 32px !important;
        }

        .logo-icon {
            width: 35px;
            height: 35px;
            font-size: 18px;
        }

        .logo-text {
            font-size: 1.1em;
        }
    }
</style>

<!-- Extraordinary Navigation Header -->

    <a href="/" class="nav-logo">
        <div class="logo-icon">💊</div>
        <span class="logo-text">MediList Pro</span>
    </a>

    <nav class="nav-links">
        <a href="/" class="nav-link" data-page="home">
            <span class="nav-link-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="/make_html" class="nav-link" data-page="make_html">

        </a>
        <a href="/deduplicate" class="nav-link" data-page="deduplicate">
            <span class="nav-link-icon">🔧</span>

        </a>
        <a href="/search" class="nav-link" data-page="search">
            <span class="nav-link-icon">🔍</span>
            <span>Search</span>
        </a>
        <a href="/diff" class="nav-link" data-page="diff">
            <span class="nav-link-icon">📊</span>

        </a>

    <div class="nav-actions">

            <button class="install-btn" id="installBtn" onclick="showInstallHelp()">

<nav class="mobile-nav" id="mobileNav">

<script>
    // Theme toggle
    function toggleTheme() {
        const body = document.body;
        const themeToggle = document.getElementById('themeToggle');

        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            themeToggle.textContent = '🌙';
            localStorage.setItem('theme', 'light');
        } else {
            body.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀️';
            localStorage.setItem('theme', 'dark');
        }
    }

    // Apply saved theme (with system preference fallback) and sync the toggle icon.
    // Exposed as a named function so pages may call initTheme() after DOM ready.
    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const themeToggle = document.getElementById('themeToggle');
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.body.setAttribute('data-theme', 'dark');
            if (themeToggle) themeToggle.textContent = '☀️';
        } else {
            if (themeToggle) themeToggle.textContent = '🌙';
        }
    }

    // Apply theme on load (idempotent; harmless even if a page also calls initTheme later)
    initTheme();

    // Mobile menu toggle
    function toggleMobileMenu() {
        const mobileNav = document.getElementById('mobileNav');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        mobileNav.classList.toggle('show');
        mobileMenuBtn.classList.toggle('active');
    }

    // Close mobile menu when clicking outside
    document.addEventListener('click', function(e) {
        const mobileNav = document.getElementById('mobileNav');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        if (mobileNav && mobileMenuBtn && !mobileNav.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
            mobileNav.classList.remove('show');
            mobileMenuBtn.classList.remove('active');
        }
    });

    // Set active navigation link based on current page
    (function() {
        const currentPage = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link');

        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPage || (currentPage === '/' && href === '/')) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
    })();

    // PWA Install prompt
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    function showInstallHelp() {
        if (deferredPrompt) {
            // Auto install available
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                deferredPrompt = null;
            });
        } else {
            // Show manual instructions
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isAndroid = /Android/.test(navigator.userAgent);

            let msg = '';
            if (isIOS) {
                msg = 'To install on iPhone/iPad:\n\n1. Tap the Share button (box with arrow)\n2. Scroll down and tap "Add to Home Screen"\n3. Tap "Add"';
            } else if (isAndroid) {
                msg = 'To install on Android:\n\n1. Tap the menu (3 dots) in browser\n2. Tap "Add to Home Screen" or "Install App"\n3. Tap "Add"';
            } else {
                msg = 'To install:\n\n1. Open browser menu\n2. Look for "Install App" or "Add to Home Screen"';
            }
            alert(msg);
        }
    }

    if (installBtn) {
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });

        // Hide install button if already installed (standalone mode)
        if (window.matchMedia('(display-mode: standalone)').matches) {
            installBtn.style.display = 'none';
        }
    }
</script>
