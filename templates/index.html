                                                🔤 Sort A-Z
                                            </button>
                                            <button class="btn btn-download btn-small" onclick="downloadFile(${item.id}, 'Session-${item.id}.txt')">
                                                ⬇️ Download
                                            </button>
                                            <button class="btn btn-new btn-small" onclick="openNewEditor(${item.id})">
                                                ✏️ New Editor
                                            </button>
                                            <button class="btn btn-primary btn-small" onclick="redirectToMakeHTML(${item.id})">
                                                📄 Make HTML File
                                            </button>
                                        </div>
                                    </div>
                                `;
                                document.getElementById('resultsContainer').insertAdjacentHTML('beforeend', cardHtml);
                            });

                            // Hide new editor section since we have content
                            const newEditorSection = document.getElementById('newEditorSection');
                            if (newEditorSection) {
                                newEditorSection.classList.add('hidden');
                            }

                            // Update file counter
                            updateFileCounter();

                            // Show upload section if not at max files
                            if (fileCount < maxFiles) {
                                document.getElementById('uploadSection').classList.add('show');
                            } else {
                                document.getElementById('uploadSection').classList.remove('show');
                                const maxMsg = document.createElement('div');
                                maxMsg.className = 'max-reached';
                                maxMsg.innerHTML = '⚠️ Maximum 3 files reached. Refresh page to start over.';
                                document.getElementById('resultsContainer').insertAdjacentHTML('beforeend', '<div class="max-reached">⚠️ Maximum 3 files reached. Refresh page to start over.</div>');
                            }
                        }
                    } else {
                        // Session expired, remove the old data
                        sessionStorage.removeItem('mainPageSession');
                    }
                } catch (e) {
                    console.error('Error parsing main page session data:', e);
                    sessionStorage.removeItem('mainPageSession');
                }
            }
        }

        // Check if page was refreshed by checking session storage for a reload flag
        window.addEventListener('load', function() {
            const pageReloaded = sessionStorage.getItem('mainPageReloaded');
            if (!pageReloaded) {
                // This is not a refresh, so load existing session data
                loadAllContentFromSession();
            } else {
                // This is a refresh, so clear the session data and remove the flag
                sessionStorage.removeItem('mainPageSession');
                sessionStorage.removeItem('mainPageReloaded');
            }
        });

        // Set flag before page unloads to detect if it's a refresh/navigation
        window.addEventListener('beforeunload', function() {
            sessionStorage.setItem('mainPageReloaded', 'true');
        });

        // Save content when user makes changes in any textarea
        document.addEventListener('DOMContentLoaded', function() {
            // Save content when user stops typing in any markdown textarea
            document.addEventListener('input', function(e) {
                if (e.target && e.target.classList.contains('markdown-box')) {
                    clearTimeout(window.markdownSaveTimeout);
                    window.markdownSaveTimeout = setTimeout(saveAllContentToSession, 1000); // Save after 1 second of inactivity
                }
            });

            // Also save when the window loses focus
            window.addEventListener('blur', saveAllContentToSession);

            // Save when user navigates away from the page
            window.addEventListener('beforeunload', saveAllContentToSession);
        });

        // Save state when navigating to Make HTML page
        function saveStateBeforeNavigateToMakeHTML(index) {
            saveAllContentToSession();
            redirectToMakeHTML(index);
        }

        function toggleDeleteButtonsMain(id) { /* no-op, kept for compat */ }
        function toggleDeleteButtonsTab(id) { /* no-op, kept for compat */ }
        function toggleEditButtonsTab(id) { /* no-op, kept for compat */ }

        // Show tab for main page
        function showTabMain(id, tab) {
            const tabEdit = document.getElementById(`tabEdit-${id}`);
            const tabPreview = document.getElementById(`tabPreview-${id}`);
            const textarea = document.getElementById(`editorTextarea-${id}`);
            const preview = document.getElementById(`previewContent-${id}`);

            if (tab === 'edit') {
                tabEdit.classList.add('active');
                tabPreview.classList.remove('active');
                if (textarea) textarea.style.display = 'block';
                if (preview) preview.style.display = 'none';
            } else {
                tabEdit.classList.remove('active');
                tabPreview.classList.add('active');
                if (textarea) textarea.style.display = 'none';
                if (preview) preview.style.display = 'block';
                updateMainPagePreview(id);
            }
        }

        // Parse items for main page (same as make_html)
        function parseMainPageItems(text, id) {
            const items = [];
            const lines = text.split('\n');

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                if (line.includes('→')) line = line.split('→')[1];
                if (line.includes('-----')) {
                    const parts = line.split('-----');
                    const name = parts[0].trim();
                    let value = parts[1] ? parts[1].trim() : '';
                    // Preserve the value with any separator (comma, etc.)
                    items.push({ name, value });
                }
            }
            // Sort alphabetically by name
            items.sort((a, b) => a.name.toUpperCase().localeCompare(b.name.toUpperCase()));
            return items;
        }

        // Update preview for main page
        function updateMainPagePreview(id) {
            const editorTextarea = document.getElementById(`markdown-${id}`);
            if (!editorTextarea) return;

            const items = parseMainPageItems(editorTextarea.value, id);
            const tbody = document.getElementById(`previewTableBody-${id}`);

            let html = '';
            let currentLetter = '';

            items.forEach((item, i) => {
                const firstLetter = item.name.charAt(0).toUpperCase();
                if (firstLetter !== currentLetter) {
                    currentLetter = firstLetter;
                    html += `<tr style="background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white;">
                        <td colspan="4" style="text-align:center;font-weight:bold;padding:8px;">${currentLetter}</td>
                    </tr>`;
                }

                html += `<tr>
                    <td class="col-delete">
                        <button class="delete-btn" onclick="deleteRowMainPage('${id}', this.closest('tr'))"
                            style="background:#dc3545;color:white;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;margin:0 auto;"
                            title="Delete">✕</button>
                    </td>
                    <td class="col-num">${i + 1}</td>
                    <td class="col-name editable-cell" style="cursor:pointer;" onclick="editCellInlineMainPage('${id}', this, 'name', '${escapeHtml(item.name)}', '${escapeHtml(item.value)}')">${escapeHtml(item.name)}</td>
                    <td class="col-value editable-cell" style="cursor:pointer;" onclick="editCellInlineMainPage('${id}', this, 'value', '${escapeHtml(item.name)}', '${escapeHtml(item.value)}')">${escapeHtml(item.value)}</td>
                </tr>`;
            });

            if (tbody) tbody.innerHTML = html;
        }

        // Update item count for main page
        function updateMainPageItemCount(id) {
            const ta = document.getElementById(`markdown-${id}`);
            if (!ta) return;
            const items = parseMainPageItems(ta.value, id);
            const itemCountElement = document.getElementById(`itemCount-${id}`);
            if (itemCountElement) itemCountElement.textContent = `${items.length} items`;
        }

        // Toggle delete buttons for main page preview - show X buttons when checkbox is checked
        function toggleDeleteButtonsTab(id) {
            // Update the preview to show or hide delete buttons based on checkbox state
            updateMainPagePreview(id);
        }

        // Toggle edit buttons for main page preview - show pen buttons when checkbox is checked
        function toggleEditButtonsTab(id) {
            // Update the preview to show or hide edit buttons based on checkbox state
            updateMainPagePreview(id);
        }

        // Helper function to escape HTML for safe attribute values (main page)
        const escapeHtmlMainPage = escapeHtml;

        // Track if we're currently editing to prevent double-click issues
        let isEditingMainPage = false;
        let pendingEditMainPage = null;
        let currentEditingId = null;
        let savingInProgress = false;

        // Edit a single cell inline on main page - click on name or value to edit just that cell
        function editCellInlineMainPage(id, cell, fieldType, itemName, itemValue) {
            // If save is in progress, just queue the edit
            if (savingInProgress) {
                pendingEditMainPage = { id, fieldType, itemName, itemValue };
                return;
            }

            // If already editing, queue this edit and save current
            if (isEditingMainPage) {
                pendingEditMainPage = { id, fieldType, itemName, itemValue };
                savingInProgress = true;
                // Get current input value and save
                const currentInput = document.querySelector('.inline-edit-input');
                if (currentInput) {
                    // Directly save instead of triggering blur
                    const currentId = currentEditingId;
                    const inputValue = currentInput.value.trim();
                    // Get the original data from the input's parent context
                    const currentCell = currentInput.closest('td');
                    if (currentCell && currentCell.dataset) {
                        // Save will be handled by the existing blur handler
                        currentInput.blur();
                    } else {
                        currentInput.blur();
                    }
                }
                return;
            }

            isEditingMainPage = true;
            currentEditingId = id;
            const originalValue = fieldType === 'name' ? itemName : itemValue;

            // Create editable input using CSS class
            cell.innerHTML = `<input type="text" class="inline-edit-input" value="${escapeHtmlMainPage(originalValue)}">`;

            const input = cell.querySelector('input');
            input.focus();
            input.select();

            // Scroll to make input visible (especially important on mobile)
            setTimeout(() => {
                const rect = input.getBoundingClientRect();
                const windowHeight = window.innerHeight;

                // If input is near bottom of screen, scroll it up
                if (rect.bottom > windowHeight - 100) {
                    const scrollAmount = rect.bottom - (windowHeight - 100);
                    window.scrollBy({ top: scrollAmount, behavior: 'smooth' });
                }
            }, 100);

            // Store edit context on the input for reference
            input.dataset.editId = id;
            input.dataset.editField = fieldType;
            input.dataset.editName = itemName;
            input.dataset.editValue = itemValue;

            // Save on Enter, cancel on Escape
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();

                    // Apply formatting if this is a value field
                    let formattedValue = input.value.trim();
                    if (fieldType === 'value') {
                        if (/^\d+$/.test(formattedValue)) {
                            // If it's just digits, add .00%
                            formattedValue = formattedValue + '.00%';
                        } else if (/^\d+\.\d+$/.test(formattedValue)) {
                            // If it's number with decimal, ensure it ends with %
                            if (!formattedValue.endsWith('%')) {
                                formattedValue = formattedValue + '%';
                            }
                        }
                    }

                    pendingEditMainPage = null;
                    saveCellEditMainPage(id, fieldType, itemName, itemValue, formattedValue);
                } else if (e.key === 'Escape') {
                    isEditingMainPage = false;
                    pendingEditMainPage = null;
                    savingInProgress = false;
                    updateMainPagePreview(id);
                }
            });

            input.addEventListener('blur', function() {
                // Format percentage value on blur if this is a value field
                if (fieldType === 'value') {
                    const currentValue = input.value.trim();
                    if (/^\d+$/.test(currentValue)) {
                        // If it's just digits, add .00%
                        input.value = currentValue + '.00%';
                    } else if (/^\d+\.\d+$/.test(currentValue)) {
                        // If it's number with decimal, ensure it ends with %
                        if (!currentValue.endsWith('%')) {
                            input.value = currentValue + '%';
                        }
                    }
                }

                setTimeout(() => {
                    if (isEditingMainPage && !savingInProgress) {
                        savingInProgress = true;
                        saveCellEditMainPage(id, fieldType, itemName, itemValue, input.value.trim());
                    } else if (isEditingMainPage && savingInProgress) {
                        // Already saving, just let it complete
                        saveCellEditMainPage(id, fieldType, itemName, itemValue, input.value.trim());
                    }
                }, 50);
            });
        }

        // Save single cell edit on main page
        function saveCellEditMainPage(id, fieldType, originalName, originalValue, newValue) {
            // Prevent double saves
            if (!isEditingMainPage && !savingInProgress) {
                return;
            }

            isEditingMainPage = false;

            if (fieldType === 'name' && !newValue) {
                alert('Item name cannot be empty');
                savingInProgress = false;
                updateMainPagePreview(id);
                checkPendingEditMainPage();
                return;
            }

            // Update the textarea
            const textarea = document.getElementById(`markdown-${id}`);
            if (!textarea) {
                savingInProgress = false;
                checkPendingEditMainPage();
                return;
            }

            let content = textarea.value;

            // Find and replace the line
            const lines = content.split('\n');
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].includes(originalName) && lines[i].includes('-----')) {
                    if (fieldType === 'name') {
                        lines[i] = `${newValue}----- ${originalValue}`;
                    } else {
                        lines[i] = `${originalName}----- ${newValue}`;
                    }
                    break;
                }
            }

            textarea.value = lines.join('\n');

            // Update item count and refresh preview
            updateMainPageItemCount(id);
            updateMainPagePreview(id);

            // Reset flags and check for pending edit
            savingInProgress = false;
            checkPendingEditMainPage();
        }

        // Check and execute pending edit on main page by finding the cell in refreshed DOM
        function checkPendingEditMainPage() {
            if (pendingEditMainPage) {
                const { id, fieldType, itemName, itemValue } = pendingEditMainPage;
                pendingEditMainPage = null;

                // Find the cell in the refreshed preview table
                setTimeout(() => {
                    const rows = document.querySelectorAll(`#previewTableBody-${id} tr`);
                    for (const row of rows) {
                        const cells = row.querySelectorAll('td');
                        // Skip header rows (single cell spanning multiple columns)
                        if (cells.length < 3) continue;

                        // Structure: [delete] [#] [name] [value]
                        const nameCell = cells[2];
                        const valueCell = cells[3];

                        // Decode HTML entities for comparison
                        const cellText = nameCell ? nameCell.textContent.trim() : '';
                        const searchName = decodeHtmlEntities(itemName);

                        if (cellText === searchName) {
                            const targetCell = fieldType === 'name' ? nameCell : valueCell;
                            editCellInlineMainPage(id, targetCell, fieldType, itemName, itemValue);
                            break;
                        }
                    }
                }, 50);
            }
        }

        // Helper to decode HTML entities
        function decodeHtmlEntities(text) {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = text;
            return textarea.value;
        }

        // Delete a row from main page preview (same concept as make_html)
        function deleteRowMainPage(id, row) {
            const cells = row.querySelectorAll('td');
            // Structure: [delete] [#] [name] [value]
            if (cells.length >= 4) {
                const itemName = cells[2].textContent.trim();
                const itemValue = cells[3].textContent.trim();
                const ta = document.getElementById(`markdown-${id}`);
                if (!ta) return;
                const linePattern = new RegExp(`^.*${escapeRegExp(itemName)}.*-----.*${escapeRegExp(itemValue)}.*$`, 'gm');
                ta.value = ta.value.replace(linePattern, '').replace(/^\s*[\r\n]/gm, '').trim();
                updateMainPageItemCount(id);
                updateMainPagePreview(id);
            }
        }

        // Setup input listener for main page editor
        function setupMainPageInputListener(id) {
            const ta = document.getElementById(`markdown-${id}`);
            if (ta) {
                ta.addEventListener('input', function() {
                    updateMainPageItemCount(id);
                    updateMainPagePreview(id);
                });
            }
        }

        // Refresh preview tab
        function refreshPreview(id) {
            const checkbox = document.getElementById(`enableDeleteButtons-${id}`);
            if (checkbox && checkbox.checked) {
                const tabPreview = document.getElementById(`tabPreview-${id}`);
                if (tabPreview && tabPreview.classList.contains('active')) {
                    updateMainPagePreview(id); // If on preview tab, update preview
                } else {
                    updateMainPageItemCount(id); // If on edit tab, just update count
                }
            } else {
                // If not in tab view, update the original preview if it exists
                const textarea = document.getElementById(`markdown-${id}`);
                if (textarea) {
                    const lines = textarea.value.split('\n').filter(line => line.trim() !== '');
                    let previewHtml = '';
                    lines.forEach((line, index) => {
                        if (line.trim() !== '') {
                            previewHtml += `<div style="margin-bottom: 5px; padding: 5px; background: #f1f3f5; border-radius: 4px; word-break: break-word; font-family: monospace; font-size: 13px;">${escapeHtml(line)}</div>`;
                        }
                    });
                    const previewDiv = document.getElementById(`preview-${id}`);
                    if (previewDiv) {
                        previewDiv.innerHTML = previewHtml;
                    }
                }
            }
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* ===== Columnar output view (Old TXT + Extended TXT) ===== */

        // Parse one TXT line into {name, disc, bonus, tp, tax}.
        // Accepts both legacy "Name----- 5%," and extended "Name----- 5%|tp|bonus|tax".
        function parseLineForColumns(line) {
            line = line.trim();
            if (!line) return null;
            // Strip leading "N→ " arrow markers if present.
            const arrow = line.indexOf('→');
            if (arrow !== -1) line = line.slice(arrow + 1).trim();
            // Strip trailing comma/semicolon separators (writer adds them).
            while (line.endsWith(',') || line.endsWith(';')) line = line.slice(0, -1).trim();

            let name = '', disc = '', bonus = '', tp = '', tax = '';
            let nameValuePart = line;

            if (line.includes('|')) {
                const parts = line.split('|');
                nameValuePart = parts[0] || '';
                tp    = (parts[1] || '').trim();
                bonus = (parts[2] || '').trim();
                tax   = (parts[3] || '').trim() || '0.00';
            }

            const sep = nameValuePart.indexOf('-----');
            if (sep === -1) {
                name = nameValuePart.trim();
            } else {
                name = nameValuePart.slice(0, sep).trim();
                disc = nameValuePart.slice(sep + 5).trim();
                while (disc.endsWith(',') || disc.endsWith(';')) disc = disc.slice(0, -1).trim();
            }
            return { name, disc, bonus, tp, tax };
        }

        // Render the column-table view for one result card.
        function renderColumnTable(fileCount) {
            const wrap = document.getElementById(`columnView-${fileCount}`);
            const tableWrap = document.getElementById(`columnTableWrap-${fileCount}`);
            const textarea = document.getElementById(`markdown-${fileCount}`);
            if (!wrap || !tableWrap || !textarea) return;

            const lines = textarea.value.split('\n').map(parseLineForColumns).filter(Boolean);
            if (lines.length === 0) {
                wrap.style.display = 'none';
                return;
            }
            wrap.style.display = 'block';

            // Read column-visibility checkboxes.
            const checks = wrap.querySelectorAll('input[type="checkbox"][data-col]');
            const visible = {};
            checks.forEach(cb => { visible[cb.dataset.col] = cb.checked; });

            const colDefs = [
                { key: 'num',   header: '#',     cls: 'col-num' },
                { key: 'code',  header: 'Code',  cls: 'col-value' },
                { key: 'name',  header: 'Name',  cls: 'col-name' },
                { key: 'disc',  header: 'Disc',  cls: 'col-value' },
                { key: 'bonus', header: 'Bonus', cls: 'col-value' },
                { key: 'tp',    header: 'T.P',   cls: 'col-value' },
                { key: 'tax',   header: 'Tax',   cls: 'col-value' },
            ];

            let html = '<table><thead><tr>';
            colDefs.forEach(c => {
                if (visible[c.key]) html += `<th class="${c.cls}">${c.header}</th>`;
            });
            html += '</tr></thead><tbody>';

            lines.forEach((row, i) => {
                html += '<tr>';
                colDefs.forEach(c => {
                    if (!visible[c.key]) return;
                    let cell = '';
                    if (c.key === 'num') cell = String(i + 1);
                    else cell = row[c.key] || '';
                    html += `<td class="${c.cls}">${escapeHtml(cell)}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            tableWrap.innerHTML = html;
        }

        // Refresh preview when textarea content changes
        function setupPreviewRefresh() {
            // The individual editors have their own listeners now
            // This is just for the original markdown boxes
        }

        // Initialize preview refresh when page loads
        document.addEventListener('DOMContentLoaded', function() {
            setupPreviewRefresh();
        });
    </script>
